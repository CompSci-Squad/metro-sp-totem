name: metro_sp_totem
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.11.0  # Atualize para a versão mais recente compatível
  image: ^4.3.0
  http: ^0.13.5
  flutter_dotenv: ^5.2.1
  google_mlkit_face_detection: ^0.4.0 # Ou a versão mais recente
  firebase_core: ^2.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
